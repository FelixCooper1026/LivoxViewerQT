name: Build packages
run-name: Build and publish ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated version tag with Chinese release notes (e.g. v2.5.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.read.outputs.number }}
      commit: ${{ steps.read.outputs.commit }}
      tag_object: ${{ steps.read.outputs.tag_object }}
      environment_tag: ${{ steps.environment.outputs.tag }}
      linux_image: ${{ steps.environment.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - id: read
        name: Check annotated tag, Chinese notes and project version
        env:
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import subprocess
          from pathlib import Path

          text = Path('CMakeLists.txt').read_text(encoding='utf-8')
          match = re.search(r'project\s*\(\s*LivoxViewerQT\b.*?\bVERSION\s+(\d+\.\d+\.\d+)', text, re.S)
          if not match:
              raise SystemExit('Project version not found in CMakeLists.txt')
          version = match.group(1)
          tag = os.environ['TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match project version {version}')
          ref = f'refs/tags/{tag}'
          def git(*args):
              return subprocess.check_output(['git', *args], encoding='utf-8').strip()
          if git('cat-file', '-t', ref) != 'tag':
              raise SystemExit('Release requires an annotated tag, not a lightweight tag')
          notes = git('for-each-ref', '--format=%(contents)', ref)
          if not re.search(r'[\u4e00-\u9fff]', notes):
              raise SystemExit('Tag annotation must contain user-facing Chinese release notes')
          commit = git('rev-parse', 'HEAD')
          tag_object = git('rev-parse', ref)
          metadata = dict(tag=tag, version=version, commit=commit, tag_object=tag_object)
          Path(os.environ['RUNNER_TEMP'], 'release-metadata.json').write_text(
              json.dumps(metadata), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'number={version}\n')
              output.write(f'commit={commit}\n')
              output.write(f'tag_object={tag_object}\n')
          PY

      - id: environment
        name: Read fixed build environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="$(cat ci/environment-version)"
          gh release download "$tag" --pattern linux-image.txt --dir "$RUNNER_TEMP/ci-environment"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$(cat "$RUNNER_TEMP/ci-environment/linux-image.txt")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata.json
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      QT_DIR: C:\livox-build-env\Qt\6.8.3\msvc2022_64
      LIVOX_THIRD_PARTY_ROOT: C:/livox-build-env/third-party
      ISCC_EXE: C:\livox-build-env\innosetup\ISCC.exe
      PACKAGE_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Download fixed Windows environment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_TAG: ${{ needs.version.outputs.environment_tag }}
        run: |
          gh release download "$env:ENV_TAG" --pattern windows-env.7z --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Environment download failed' }
          7z x "$env:RUNNER_TEMP\windows-env.7z" '-oC:\livox-build-env' -y
          if ($LASTEXITCODE -ne 0) { throw 'Environment extraction failed' }
      - name: Select MSVC 2022
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VS_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Build ZIP and installer
        shell: cmd
        run: scripts\package_windows_release.bat incremental
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            dist/windows/LivoxViewerQT-${{ needs.version.outputs.number }}-win64-portable.zip
            dist/windows/installer/LivoxViewerQT_Setup_v${{ needs.version.outputs.number }}_x64.exe

  linux:
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.version.outputs.linux_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 60
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Build DEB and AppImage from shared compilation
        shell: bash
        run: |
          export BUILD_DIR="$GITHUB_WORKSPACE/build/linux-package"
          bash scripts/create_deb.sh
          bash scripts/create_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            dist/linux/livoxviewerqt_${{ needs.version.outputs.number }}_amd64.deb
            dist/linux/LivoxViewerQT-${{ needs.version.outputs.number }}-x86_64.AppImage

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - name: Verify tag still matches the build
        env:
          TAG: ${{ inputs.release_tag }}
          BUILD_COMMIT: ${{ needs.version.outputs.commit }}
          TAG_OBJECT: ${{ needs.version.outputs.tag_object }}
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BUILD_COMMIT" ||
                "$(git rev-parse "refs/tags/$TAG")" != "$TAG_OBJECT" ]]; then
            echo "Release tag or annotation changed during the build" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: release-assets
          merge-multiple: true
      - name: Publish packages with Chinese tag notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          files=(
            "release-assets/installer/LivoxViewerQT_Setup_v${{ needs.version.outputs.number }}_x64.exe"
            "release-assets/LivoxViewerQT-${{ needs.version.outputs.number }}-win64-portable.zip"
            "release-assets/livoxviewerqt_${{ needs.version.outputs.number }}_amd64.deb"
            "release-assets/LivoxViewerQT-${{ needs.version.outputs.number }}-x86_64.AppImage"
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            git for-each-ref --format='%(contents)' "refs/tags/$TAG" |
              gh release edit "$TAG" --notes-file - --draft=false --latest
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag --title "$TAG" --notes-from-tag --latest
          fi
