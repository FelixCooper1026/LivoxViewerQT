name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.read.outputs.number }}
      environment_tag: ${{ steps.environment.outputs.tag }}
      linux_image: ${{ steps.environment.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Check tag and project version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path('CMakeLists.txt').read_text(encoding='utf-8')
          match = re.search(r'project\s*\(\s*LivoxViewerQT\b.*?\bVERSION\s+(\d+\.\d+\.\d+)', text, re.S)
          if not match:
              raise SystemExit('Project version not found in CMakeLists.txt')
          version = match.group(1)
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag {os.environ["GITHUB_REF_NAME"]} does not match project version {version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'number={version}\n')
          PY

      - id: environment
        name: Read fixed build environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="$(cat ci/environment-version)"
          gh release download "$tag" --pattern linux-image.txt --dir "$RUNNER_TEMP/ci-environment"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$(cat "$RUNNER_TEMP/ci-environment/linux-image.txt")" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      QT_DIR: C:\livox-build-env\Qt\6.8.3\msvc2022_64
      LIVOX_THIRD_PARTY_ROOT: C:/livox-build-env/third-party
      ISCC_EXE: C:\livox-build-env\innosetup\ISCC.exe
      PACKAGE_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed Windows environment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_TAG: ${{ needs.version.outputs.environment_tag }}
        run: |
          gh release download "$env:ENV_TAG" --pattern windows-env.7z --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Environment download failed' }
          7z x "$env:RUNNER_TEMP\windows-env.7z" '-oC:\livox-build-env' -y
          if ($LASTEXITCODE -ne 0) { throw 'Environment extraction failed' }
      - name: Select MSVC 2022
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VS_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Build ZIP and installer
        shell: cmd
        run: scripts\package_windows_release.bat incremental
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            dist/windows/LivoxViewerQT-${{ needs.version.outputs.number }}-win64-portable.zip
            dist/windows/installer/LivoxViewerQT_Setup_v${{ needs.version.outputs.number }}_x64.exe

  linux:
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.version.outputs.linux_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 60
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Build DEB and AppImage from shared compilation
        shell: bash
        run: |
          export BUILD_DIR="$GITHUB_WORKSPACE/build/linux-package"
          bash scripts/create_deb.sh
          bash scripts/create_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            dist/linux/livoxviewerqt_${{ needs.version.outputs.number }}_amd64.deb
            dist/linux/LivoxViewerQT-${{ needs.version.outputs.number }}-x86_64.AppImage

  release:
    if: github.event_name == 'push'
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          files=(
            "release-assets/installer/LivoxViewerQT_Setup_v${{ needs.version.outputs.number }}_x64.exe"
            "release-assets/LivoxViewerQT-${{ needs.version.outputs.number }}-win64-portable.zip"
            "release-assets/livoxviewerqt_${{ needs.version.outputs.number }}_amd64.deb"
            "release-assets/LivoxViewerQT-${{ needs.version.outputs.number }}-x86_64.AppImage"
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
          fi
