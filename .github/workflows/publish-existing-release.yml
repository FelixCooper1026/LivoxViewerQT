name: Publish existing CI artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build packages run ID with successful version, Windows and Linux jobs
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check source run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          run_json="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")"
          status="$(jq -r '.status' <<< "$run_json")"
          source_repo="$(jq -r '.head_repository.full_name' <<< "$run_json")"
          workflow_path="$(jq -r '.path' <<< "$run_json")"
          if [[ "$status" != completed || "$source_repo" != "$GH_REPO" ||
                "$workflow_path" != '.github/workflows/release.yml' ]]; then
            echo "Run $RUN_ID is not a completed Build packages run of $GH_REPO" >&2
            exit 1
          fi
          jobs_json="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
          for job in version windows linux; do
            conclusion="$(jq -r --arg job "$job" '[.jobs[] | select(.name == $job) | .conclusion] | last // empty' <<< "$jobs_json")"
            if [[ "$conclusion" != success ]]; then
              echo "Run $RUN_ID job $job did not succeed" >&2
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: release-metadata
          path: release-metadata

      - name: Read actual build version and commit
        shell: bash
        run: |
          metadata=release-metadata/release-metadata.json
          echo "VERSION=$(jq -r '.version' "$metadata")" >> "$GITHUB_ENV"
          echo "TAG=$(jq -r '.tag' "$metadata")" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(jq -r '.commit' "$metadata")" >> "$GITHUB_ENV"
          echo "TAG_OBJECT=$(jq -r '.tag_object' "$metadata")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify annotated tag still matches the build
        shell: bash
        run: |
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != tag ||
                "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$SOURCE_SHA" ||
                "$(git rev-parse "refs/tags/$TAG")" != "$TAG_OBJECT" ]]; then
            echo "Release tag or annotation does not match the source build" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: '*-packages'
          path: release-assets
          merge-multiple: true

      - name: Publish packages with Chinese tag notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          files=(
            "release-assets/installer/LivoxViewerQT_Setup_v${VERSION}_x64.exe"
            "release-assets/LivoxViewerQT-${VERSION}-win64-portable.zip"
            "release-assets/livoxviewerqt_${VERSION}_amd64.deb"
            "release-assets/LivoxViewerQT-${VERSION}-x86_64.AppImage"
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            git for-each-ref --format='%(contents)' "refs/tags/$TAG" |
              gh release edit "$TAG" --notes-file - --draft=false --latest
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag --title "$TAG" --notes-from-tag --latest
          fi
