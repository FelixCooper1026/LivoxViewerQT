<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="9 9 82 88"
     fill="none"
     stroke="black"
     stroke-width="6"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- 左侧可见面：透明 -->
    <polygon points="65,45 15,35 15,85 65,95"
             fill="none"
             stroke="black"></polygon>

    <!-- 右侧可见面：黑色，表示右视图 -->
    <polygon points="85,25 65,45 65,95 85,75"
             fill="#7F9CB8"
             stroke="black"></polygon>

    <!-- 顶面：透明 -->
    <polygon points="85,25 35,15 15,35 65,45"
             fill="none"
             stroke="black"></polygon>
</svg>