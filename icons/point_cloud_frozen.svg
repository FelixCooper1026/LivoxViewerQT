<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="21 21 64 64"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- 2. 云朵图标内容 (变为浅灰色) -->
  <g stroke="#adb0b4" stroke-width="4.5">
    <!-- 云轮廓 -->
    <path d="
      M50 68
      H69
      C76 68, 82 63, 82 56
      C82 50, 78 45, 72 44
      C71 36, 64 30, 56 30
      C50 30, 45 33, 42 38
    " />
  </g>
  
  <!-- 浅灰色点云 -->
  <g fill="#adb0b4">
    <circle cx="24" cy="56" r="2.4"/> <circle cx="26" cy="48" r="2.2"/> <circle cx="26" cy="64" r="2.2"/>
    <circle cx="31" cy="42" r="2.0"/> <circle cx="31" cy="59" r="2.1"/> <circle cx="31" cy="68" r="2.0"/>
    <circle cx="38" cy="40" r="1.9"/> <circle cx="38" cy="55" r="1.8"/> <circle cx="38" cy="62" r="1.8"/> <circle cx="38" cy="68" r="1.8"/>
    <circle cx="44" cy="40" r="1.7"/> <circle cx="44" cy="52" r="1.7"/> <circle cx="44" cy="59" r="1.7"/> <circle cx="44" cy="68" r="1.7"/>
    <circle cx="49" cy="35" r="1.6"/> <circle cx="49" cy="42" r="1.6"/> <circle cx="49" cy="49" r="1.6"/> <circle cx="49" cy="56" r="1.6"/> <circle cx="49" cy="63" r="1.6"/>
    <circle cx="54" cy="30" r="1.5"/> <circle cx="54" cy="36" r="1.4"/> <circle cx="54" cy="42" r="1.4"/> <circle cx="54" cy="48" r="1.4"/> <circle cx="54" cy="54" r="1.4"/> <circle cx="54" cy="60" r="1.4"/>
    <circle cx="58" cy="34" r="1.3"/> <circle cx="58" cy="40" r="1.2"/> <circle cx="58" cy="46" r="1.2"/> <circle cx="58" cy="52" r="1.2"/>
    <circle cx="62" cy="39" r="1.1"/> <circle cx="62" cy="45" r="1.1"/> <circle cx="62" cy="51" r="1.1"/>
  </g>

  <!-- 3. 雪花图标 (置于正中心，黑色) -->
  <!-- 坐标 50,50 为外框正中心 -->
  <g transform="translate(50, 50)" stroke="black" stroke-width="3.5">
    <!-- 定义一个分支 -->
    <g id="snowflake-branch">
      <line x1="0" y1="0" x2="0" y2="-27" />
      <line x1="0" y1="-10" x2="-7" y2="-22" />
      <line x1="0" y1="-10" x2="7" y2="-22" />
    </g>
    <!-- 旋转生成6个分支 -->
    <use href="#snowflake-branch" transform="rotate(0)"/>
    <use href="#snowflake-branch" transform="rotate(60)"/>
    <use href="#snowflake-branch" transform="rotate(120)"/>
    <use href="#snowflake-branch" transform="rotate(180)"/>
    <use href="#snowflake-branch" transform="rotate(240)"/>
    <use href="#snowflake-branch" transform="rotate(300)"/>
  </g>

</svg>