<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义遮罩：让大圆在小圆的位置变为透明 -->
  <defs>
    <mask id="cut-off">
      <rect width="100" height="100" fill="white" />
      <circle cx="71" cy="71" r="25" fill="black" />
    </mask>
  </defs>

  <!-- 1. 时钟主体轮廓 (应用了遮罩) -->
  <circle cx="39" cy="39" r="33" stroke="black" stroke-width="7" mask="url(#cut-off)" />
  
  <!-- 2. 时钟指针：8点钟 -->
  <path d="M39 16 V39 L23 55" stroke="black" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round" />

  <!-- 3. 右下角的小圆圈 -->
  <circle cx="71" cy="71" r="25" stroke="black" stroke-width="7" />

  <!-- 4. 加号图标 -->
  <path d="M71 59 V83 M59 71 H83" stroke="black" stroke-width="7" stroke-linecap="butt" />
</svg>